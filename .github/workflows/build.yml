name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: 3.50.0's Android lint crashes on image_picker_android (2026-11-12). Raise on purpose.
          flutter-version: 3.47.9

      # The Android and web scaffolds are generated here, then our own files replace the defaults.
      - name: Generate scaffold
        run: flutter create --platforms=android,web --org com.towkirhs --project-name jarcis --no-pub .

      - name: Apply Android overlay
        run: |
          rm -f test/widget_test.dart analysis_options.yaml
          D=android/app/src/main/kotlin/com/towkirhs/jarcis
          cp android_overlay/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          for f in MainActivity AlarmReceiver AlarmScheduler BootReceiver NoteReceiver NativeChannel BackgroundRunner ActionReceiver ShareActivity MoneyCapture Conversation Voice WakeWord Ring Geo Talk Updater QuickNote PhoneCalendar; do
            cp android_overlay/$f.kt $D/$f.kt
          done
          # Tests for the phone-side command parser (run below with Gradle).
          T=android/app/src/test/kotlin/com/towkirhs/jarcis
          mkdir -p $T && cp android_overlay/test/*.kt $T/
          printf '\ndependencies {\n    testImplementation("junit:junit:4.13.2")\n    testImplementation("org.json:json:20240303")\n}\n' >> android/app/build.gradle.kts
          # Offline AI models (LiteRT-LM) need Android 11 or newer.
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 30/' android/app/build.gradle.kts
          grep -q 'minSdk = 30' android/app/build.gradle.kts
          # "Hey Jarvis" wake word, detected on the phone (openWakeWord models on LiteRT).
          printf '\ndependencies {\n    implementation("com.google.ai.edge.litert:litert:1.4.1")\n    implementation("com.google.android.gms:play-services-location:21.3.0")\n}\n' >> android/app/build.gradle.kts
          # Keep LiteRT's classes: its native code calls them by name, so shrinking must not remove them.
          printf -- '-keep class org.tensorflow.lite.** { *; }\n' >> android/app/proguard-rules.pro
          # Phones are arm64; leave out the other chip types' copies of native libraries.
          printf '\nandroid {\n    packaging {\n        jniLibs {\n            excludes += listOf("lib/x86/**", "lib/x86_64/**", "lib/armeabi-v7a/**")\n        }\n    }\n}\n' >> android/app/build.gradle.kts

      # The web app installs from Chrome like a desktop app ("Install Jarvis"): name, icons and colours.
      - name: Apply web overlay
        run: |
          cp -r web_overlay/* web/
          sed -i 's#<title>[^<]*</title>#<title>Jarvis</title>#' web/index.html
          sed -i 's#content="A new Flutter project."#content="Jarvis, your personal assistant"#' web/index.html
          sed -i 's#<meta name="apple-mobile-web-app-title" content="[^"]*">#<meta name="apple-mobile-web-app-title" content="Jarvis">#' web/index.html
          sed -i 's#</head>#  <meta name="theme-color" content="\#0B7285">\n</head>#' web/index.html
          grep -q '<title>Jarvis</title>' web/index.html

      # The overhaul branch builds a separate app, "Jarvis Dev", that installs next to the real one for testing.
      - name: Dev build identity
        if: github.ref == 'refs/heads/overhaul'
        run: |
          printf '\nandroid {\n    defaultConfig {\n        applicationIdSuffix = ".dev"\n    }\n}\n' >> android/app/build.gradle.kts
          sed -i 's/android:label="Jarvis"/android:label="Jarvis Dev"/' android/app/src/main/AndroidManifest.xml
          grep -q 'android:label="Jarvis Dev"' android/app/src/main/AndroidManifest.xml

      # Sign every release with the same key (a repository secret), so each new APK installs over the last one.
      - name: Use fixed signing key
        env:
          KS: ${{ secrets.JARVIS_KEYSTORE_B64 || secrets.JARCIS_KEYSTORE_B64 || secrets.JARVIS }}
        run: |
          if [ -z "$KS" ]; then
            echo "No signing key secret: APK will get a random key and will not update the installed app."
            exit 0
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/jarvis.keystore"
          cat >> android/app/build.gradle.kts <<EOF2
          android {
              signingConfigs {
                  create("fixed") {
                      storeFile = file("$RUNNER_TEMP/jarvis.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  getByName("release") { signingConfig = signingConfigs.getByName("fixed") }
              }
          }
          EOF2

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      # 64-bit ARM only: every phone from the last several years, and the offline AI engine only ships for it.
      - run: flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }}
      - name: Test phone-side commands
        run: cd android && ./gradlew :app:testDebugUnitTest --console=plain
      - run: flutter build web --release --base-href /jarvis/

      - name: Show signing certificate
        run: |
          "$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep SHA-256

      - name: Package
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk jarcis.apk
          (cd build/web && zip -qr ../../jarcis-web.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: jarcis-apk
          path: jarcis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jarcis-web
          path: jarcis-web.zip

      # The web app, served at https://towkirhs.github.io/jarvis/ from the gh-pages branch.
      - name: Publish web app
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web

      # A pre-release, so Obtainium and the in-app updater (which follow the latest full release) ignore it.
      - name: Publish test build
        if: github.ref == 'refs/heads/overhaul'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp jarcis.apk jarvis-dev.apk
          gh release create "overhaul-${{ github.run_number }}" jarvis-dev.apk jarcis-web.zip --prerelease --target overhaul --title "Jarvis Dev (overhaul) ${{ github.run_number }}" --notes "Test build of the overhaul branch. Installs next to the real Jarvis as a separate app called Jarvis Dev, with its own empty data."

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" jarcis.apk jarcis-web.zip --title "Jarvis build ${{ github.run_number }}" --notes "Debug-signed APK for sideloading, plus the web build."
