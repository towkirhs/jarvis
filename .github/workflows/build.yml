name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # The Android and web scaffolds are generated here, then our own files replace the defaults.
      - name: Generate scaffold
        run: flutter create --platforms=android,web --org com.towkirhs --project-name jarcis --no-pub .

      - name: Apply Android overlay
        run: |
          rm -rf test analysis_options.yaml
          D=android/app/src/main/kotlin/com/towkirhs/jarcis
          cp android_overlay/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          for f in MainActivity AlarmReceiver AlarmScheduler BootReceiver NoteReceiver; do
            cp android_overlay/$f.kt $D/$f.kt
          done

      # A fixed signing key (kept as a repository secret) lets each new APK install over the last one.
      - name: Use fixed signing key
        env:
          KS: ${{ secrets.JARVIS || secrets.JARCIS_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
          else
            echo "No JARCIS_KEYSTORE_B64 secret: APK will get a random key and will not update the installed app."
          fi

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build apk --release
      - run: flutter build web --release --base-href /jarcis/

      - name: Package
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk jarcis.apk
          (cd build/web && zip -qr ../../jarcis-web.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: jarcis-apk
          path: jarcis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jarcis-web
          path: jarcis-web.zip

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" jarcis.apk jarcis-web.zip --title "Jarvis build ${{ github.run_number }}" --notes "Debug-signed APK for sideloading, plus the web build."
