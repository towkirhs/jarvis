name: jarcis
description: Jarvis, a personal life assistant.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  image_picker: ^1.1.0
  file_picker: ^10.3.10
  excel: ^4.0.6
  path_provider: ^2.1.0
  cryptography: ^2.7.0
  archive: ^3.6.1
  google_sign_in: ^7.2.0
  flutter_edge_ai: 2.5.6 # pinned: newer versions change the offline model library
  flutter_edge_ai_litertlm: 1.19.2
  flutter_map: ^8.3.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/wakeword/
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/Bricolage-500.ttf
          weight: 500
        - asset: assets/fonts/Bricolage-700.ttf
          weight: 700
        - asset: assets/fonts/Bricolage-800.ttf
          weight: 800
